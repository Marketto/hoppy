name: Release

# Builds the installable packages and publishes a GitHub Release.
#   - push a tag:        git tag v0.2.0 && git push origin v0.2.0
#   - or run manually:   Actions → Release → Run workflow (version: 0.2.0)
# Windows, Android, macOS, Ubuntu and iPhone/iPad (unsigned .ipa for Sideloadly, ADR 0009)
# are always built. See docs/release.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.2.0)"
        required: true
      publish:
        description: "Publish the GitHub Release (off = only build the packages as workflow artifacts)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          v="${VERSION#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$v' is not a semantic version (x.y.z)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows · installer
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set version
        shell: bash
        run: sed -i 's/^version = ".*"/version = "${{ needs.meta.outputs.version }}"/' Cargo.toml
      - name: Build
        shell: bash
        run: |
          cargo build --release -p hoppy --message-format=short 2>&1 | tee build.log ||
            { bash tools/ci-annotate.sh "cargo build (release)" build.log; exit 1; }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # ISCC output is surfaced as annotations on failure (logs aren't always readable).
          $out = & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp `
            "/DAppVersion=${{ needs.meta.outputs.version }}" `
            "/DSourceExe=$PWD\target\release\hoppy.exe" `
            "/DSourceGuiExe=$PWD\target\release\hoppyw.exe" apps\windows\hoppy.iss 2>&1
          if ($LASTEXITCODE -ne 0) {
            $out | Select-Object -Last 9 | ForEach-Object { Write-Output "::error::ISCC: $_" }
            exit 1
          }
          Compress-Archive -Path target\release\hoppy.exe, target\release\hoppyw.exe, apps\windows\install.ps1, LICENSE `
            -DestinationPath dist\Hoppy-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: dist/*

  android:
    name: Android · APK (phone + tablet)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Release keystore (from secrets, never committed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/hoppy-release.jks"
            # Secrets pasted from a phone often gain spaces or line breaks: drop all whitespace.
            if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$ks" 2>/dev/null; then
              clean=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n')
              bad=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64: ${#clean} characters (must be a multiple of 4), $bad character(s) outside the base64 alphabet. It was probably truncated or extra text was pasted; paste it again as one line."
              exit 1
            fi
            echo "Keystore: $(wc -c < "$ks") bytes"
            # Fail early with a clear message instead of deep inside Gradle; prints only the
            # public certificate fingerprint, never the secrets.
            if ! keytool -list -v -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-hoppy}" > "$RUNNER_TEMP/ks.txt" 2>&1; then
              echo "::error::Keystore could not be opened: check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS ($(grep -m1 -i 'error' "$RUNNER_TEMP/ks.txt" | sed 's/[^[:print:]]//g'))"
              exit 1
            fi
            echo "::notice::Release signing certificate SHA-256: $(grep -m1 'SHA256:' "$RUNNER_TEMP/ks.txt" | sed 's/.*SHA256: //')"
            rm -f "$RUNNER_TEMP/ks.txt"
            echo "HOPPY_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway debug key and cannot be updated in place by the next release. See docs/release.md."
          fi
      - name: Build
        working-directory: apps/android
        env:
          HOPPY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HOPPY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HOPPY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle :core:test :app:testDebugUnitTest :app:assembleRelease --stacktrace
          -PhoppyVersionName=${{ needs.meta.outputs.version }}
          -PhoppyVersionCode=${{ github.run_number }}
      - name: Collect
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/Hoppy-android.apk
          rm -f "$RUNNER_TEMP/hoppy-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-android
          path: dist/*

  macos:
    name: macOS · Hoppy.app universal (Intel 2015+ and Apple silicon)
    needs: meta
    runs-on: macos-latest
    env:
      # Macs from 2015 top out at macOS 12 Monterey; build for it and later (build-app.sh
      # checks every architecture's minimum macOS).
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    # Optional Developer ID signing + notarization (docs/release.md "Signing"): skipped
    # (ad-hoc signature, Gatekeeper "Open Anyway" on first launch) until the APPLE_* secrets
    # exist. Secrets are only given to the steps that use them; `apple` publishes which
    # ones exist as plain true/false outputs for the `if:` conditions.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Set version
        run: sed -i '' 's/^version = ".*"/version = "${{ needs.meta.outputs.version }}"/' Cargo.toml
      - name: Which Apple secrets exist
        id: apple
        env:
          HAS_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          echo "has_cert=$HAS_CERT" >> "$GITHUB_OUTPUT"
          echo "has_notary=$HAS_NOTARY" >> "$GITHUB_OUTPUT"
      - name: Developer ID certificate (optional, from secrets)
        if: steps.apple.outputs.has_cert == 'true'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          kc="$RUNNER_TEMP/hoppy-signing.keychain-db"
          p12="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$p12"' EXIT
          kc_pass=$(uuidgen)
          security create-keychain -p "$kc_pass" "$kc"
          # Recorded at once, so the cleanup step deletes it even if a later command fails.
          echo "HOPPY_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERT_P12_BASE64" | tr -d ' \t\r\n' | base64 -D > "$p12" ||
            { echo "::error::APPLE_CERT_P12_BASE64 is not valid base64"; exit 1; }
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign ||
            { echo "::error::The certificate could not be imported: check APPLE_CERT_PASSWORD"; exit 1; }
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=${APPLE_SIGN_IDENTITY:-$(security find-identity -v -p codesigning "$kc" |
            sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)}
          [ -n "$identity" ] || { echo "::error::No 'Developer ID Application' identity in the certificate"; exit 1; }
          echo "::notice::Signing as: $identity"
          echo "HOPPY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: No Developer ID
        if: steps.apple.outputs.has_cert != 'true'
        run: echo "::warning::APPLE_CERT_P12_BASE64/APPLE_CERT_PASSWORD are not set — Hoppy.app is signed ad hoc and not notarized; users confirm it once in System Settings → Privacy & Security → Open Anyway (docs/release.md)."
      - name: Build Hoppy.app + dmg
        shell: bash
        run: |
          bash apps/macos/build-app.sh release "${{ needs.meta.outputs.version }}" dist 2>&1 | tee package.log ||
            { bash tools/ci-annotate.sh "macOS package" package.log; exit 1; }
      - name: Notarize (optional, from secrets)
        if: env.HOPPY_SIGN_IDENTITY != '' && steps.apple.outputs.has_notary == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/Hoppy-macos-universal.dmg --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m 2>&1 | tee notary.log
          grep -q 'status: Accepted' notary.log ||
            { echo "::error::Notarization was not accepted: $(grep -m1 'status:' notary.log)"; exit 1; }
          xcrun stapler staple dist/Hoppy-macos-universal.dmg
          spctl --assess --type open --context context:primary-signature -v dist/Hoppy-macos-universal.dmg
      - name: Remove the signing keychain
        if: always() && env.HOPPY_KEYCHAIN != ''
        run: security delete-keychain "$HOPPY_KEYCHAIN" || true
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: dist/Hoppy-macos-universal.dmg

  linux:
    name: Ubuntu · .deb (22.04+)
    needs: meta
    # The oldest supported Ubuntu: the binaries then need glibc ≤ 2.35 and run on 22.04+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set version
        run: sed -i 's/^version = ".*"/version = "${{ needs.meta.outputs.version }}"/' Cargo.toml
      - run: cargo install cargo-deb --locked
      - name: Build
        shell: bash
        run: |
          cargo build --release -p hoppy --message-format=short 2>&1 | tee build.log ||
            { bash tools/ci-annotate.sh "cargo build (Linux release)" build.log; exit 1; }
          cargo deb -p hoppy --no-build
          mkdir -p dist
          # Stable name: the portal and the Linux update check rely on it (docs/release.md).
          cp target/debian/*.deb dist/Hoppy-linux-amd64.deb
          dpkg-deb --info dist/Hoppy-linux-amd64.deb
          dpkg-deb --contents dist/Hoppy-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux
          path: dist/*

  ios:
    name: iPhone/iPad · unsigned .ipa (sideload with Sideloadly)
    needs: meta
    runs-on: macos-latest
    # No Apple Developer account (ADR 0009): the .ipa is not signed; the user installs it
    # from Windows/macOS with Sideloadly and a free Apple ID (re-sign every 7 days).
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Set version
        run: sed -i '' 's/^version = ".*"/version = "${{ needs.meta.outputs.version }}"/' Cargo.toml
      - name: XcodeGen
        run: brew install xcodegen
      - name: Build Hoppy-ios-unsigned.ipa
        shell: bash
        env:
          HOPPY_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash apps/ios/build-ipa.sh "${{ needs.meta.outputs.version }}" dist 2>&1 | tee ipa.log ||
            { python3 tools/ci_annotate_xcode.py "iOS package" ipa.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-ios
          path: dist/Hoppy-ios-unsigned.ipa

  publish:
    name: Publish release
    needs: [meta, windows, android, macos, linux, ios]
    # Publish when every enabled job succeeded (disabled ones are 'skipped').
    if: >-
      always() && needs.meta.result == 'success' && inputs.publish != false &&
      needs.windows.result == 'success' && needs.android.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.meta.outputs.version }}
        run: |
          tag="v$V"
          cat > notes.md <<EOF
          ## Hoppy $V

          Download page: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

          | Platform | File |
          | --- | --- |
          | Windows 10/11 (64-bit) | \`Hoppy-Setup-x64.exe\` (installer) · \`Hoppy-windows-x64.zip\` (portable) |
          | Android 10+ (phone and tablet) | \`Hoppy-android.apk\` |
          | Ubuntu 22.04+ (64-bit) | \`Hoppy-linux-amd64.deb\` (open it with App Center / Software Install) |
          | macOS 12+ (Intel Macs from 2015 and Apple silicon) | \`Hoppy-macos-universal.dmg\` (drag Hoppy to Applications) |
          | iPhone / iPad, iOS/iPadOS 15+ | \`Hoppy-ios-unsigned.ipa\` (install with Sideloadly from a PC or Mac, free Apple ID) |

          > Proof of concept: protocol v0 is **not encrypted**. Use Hoppy only on networks you trust.
          > Windows may show a SmartScreen warning (the installer is not code-signed yet): More info → Run anyway.
          > macOS: unless notarized, the first launch is blocked once: System Settings → Privacy & Security → **Open Anyway** (macOS 12–14: right-click Hoppy → Open also works).
          > iPhone/iPad: the .ipa is **unsigned**. Install it with Sideloadly (https://sideloadly.io) and your Apple ID; the free signature lasts **7 days** (then sideload again). Turn on Settings → Privacy & Security → **Developer Mode**, and trust your Apple ID under Settings → General → VPN & Device Management. Hoppy receives only while it is open. Details: docs/platforms/ios.md in the repository.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Hoppy $V" --notes-file notes.md --target "${{ github.sha }}"
          fi
