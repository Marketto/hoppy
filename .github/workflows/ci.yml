name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · check (incl. hoppyw desktop) + interop + Kotlin core
    runs-on: ubuntu-latest
    # `dev.py all` → clippy --all-targets builds both binaries (hoppy, hoppyw) and runs the
    # Linux desktop tests (crates/hoppy-cli/src/linux/). The .deb is built by release.yml.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # Output also goes to a log that tools/ci-annotate.sh turns into annotations on failure
      # (agents read annotations, not logs): failing tests, ✗ lines, Python tracebacks,
      # interop/selftest FAIL lines, Gradle errors, and the last 60 lines.
      - name: dev.py all
        shell: bash
        run: |
          python3 -u tools/dev.py all 2>&1 | tee all.log ||
            { bash tools/ci-annotate.sh "Linux dev.py all" all.log 60; exit 1; }

  windows:
    name: Windows · tests + hoppy.exe + hoppyw.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Only place where the #[cfg(windows)] code is compiled and linted. CI logs are not
      # readable by agents, so failures are re-emitted as annotations (tools/ci-annotate.sh).
      # GitHub's bash runs with -e -o pipefail; `cmd | tee log || …` keeps the exit status.
      - name: Clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log ||
            { bash tools/ci-annotate.sh "clippy (Windows)" clippy.log; exit 1; }
      - name: Test
        shell: bash
        run: |
          cargo test --workspace --message-format=short 2>&1 | tee test.log ||
            { bash tools/ci-annotate.sh "cargo test (Windows)" test.log; exit 1; }
      - name: Build
        shell: bash
        run: |
          cargo build --release -p hoppy --message-format=short 2>&1 | tee build.log ||
            { bash tools/ci-annotate.sh "cargo build (Windows)" build.log; exit 1; }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/hoppy.exe dist/
          Copy-Item target/release/hoppyw.exe dist/
          Copy-Item apps/windows/install.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: hoppy-windows
          path: dist/

  macos:
    name: macOS · tests + universal Hoppy.app (Intel 2015+ and Apple silicon)
    runs-on: macos-latest
    # A hung GUI/socket test must not hold a macOS runner for hours.
    timeout-minutes: 60
    env:
      # Macs from 2015 top out at macOS 12 Monterey: build for it (checked by build-app.sh).
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    # Only place where src/macos/{ui,login}.rs is compiled. Failures become annotations
    # (tools/ci-annotate.sh): agents can read those, not the logs.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log ||
            { bash tools/ci-annotate.sh "clippy (macOS)" clippy.log; exit 1; }
      - name: Clippy (Intel)
        shell: bash
        run: |
          cargo clippy -p hoppy --target x86_64-apple-darwin --message-format=short -- -D warnings 2>&1 | tee clippy-x86.log ||
            { bash tools/ci-annotate.sh "clippy (macOS x86_64)" clippy-x86.log; exit 1; }
      # perl's alarm turns a hanging test into a failure with annotations (cargo prints
      # "has been running for over 60 seconds" for the culprit).
      - name: Test
        shell: bash
        run: |
          perl -e 'alarm 1200; exec @ARGV' cargo test --workspace --message-format=short 2>&1 | tee test.log ||
            { bash tools/ci-annotate.sh "cargo test (macOS)" test.log; exit 1; }
      # Debug build: objc2 checks every Objective-C message against the runtime's types.
      # Runs the AppKit backend headless (`hoppyw --smoke-test`), bare and inside a bundle.
      - name: AppKit smoke test
        shell: bash
        run: |
          cargo build -p hoppy --message-format=short 2>&1 | tee smoke.log ||
            { bash tools/ci-annotate.sh "cargo build (macOS debug)" smoke.log; exit 1; }
          bash apps/macos/build-app.sh bundle target/debug/hoppyw target/debug/hoppy target/smoke/Hoppy.app 2>&1 | tee -a smoke.log ||
            { bash tools/ci-annotate.sh "smoke bundle (macOS)" smoke.log; exit 1; }
          for exe in target/debug/hoppyw target/smoke/Hoppy.app/Contents/MacOS/hoppyw; do
            echo "== $exe" | tee -a smoke.log
            RUST_BACKTRACE=1 perl -e 'alarm 120; exec @ARGV' "$exe" --smoke-test 2>&1 | tee -a smoke.log ||
              { bash tools/ci-annotate.sh "AppKit smoke test ($exe)" smoke.log; exit 1; }
          done
      - name: Universal Hoppy.app + dmg
        shell: bash
        run: |
          bash apps/macos/build-app.sh release "" dist 2>&1 | tee package.log ||
            { bash tools/ci-annotate.sh "macOS package" package.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: hoppy-macos
          path: dist/Hoppy-macos-universal.dmg

  ios:
    name: iOS · Rust core + unsigned Hoppy.app + simulator tests
    runs-on: macos-latest
    # iPhone/iPad (ADR 0009): the Rust core as HoppyFFI.xcframework, the SwiftUI app + Share
    # extension built unsigned for devices (what Sideloadly installs) and the FFI smoke tests
    # on a simulator. Logs are not readable by agents: failures become annotations
    # (tools/ci-annotate.sh for cargo, tools/ci_annotate_xcode.py for xcodebuild).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (iOS)
        shell: bash
        run: |
          cargo clippy -p hoppy-ffi --all-targets --target aarch64-apple-ios --message-format=short -- -D warnings 2>&1 | tee clippy.log ||
            { bash tools/ci-annotate.sh "clippy (iOS)" clippy.log; exit 1; }
      - name: HoppyFFI.xcframework
        shell: bash
        run: |
          bash apps/ios/build-xcframework.sh release 2>&1 | tee xcframework.log ||
            { python3 tools/ci_annotate_xcode.py "Rust core for iOS" xcframework.log; exit 1; }
      - name: XcodeGen
        shell: bash
        run: |
          brew install xcodegen 2>&1 | tail -n 3
          cd apps/ios && xcodegen generate 2>&1 | tee ../../xcodegen.log ||
            { python3 ../../tools/ci_annotate_xcode.py "xcodegen" ../../xcodegen.log; exit 1; }
      - name: Simulator tests (FFI smoke)
        shell: bash
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in data if ".iOS-" in r), key=lambda r: [int(x) for x in r.split(".iOS-")[1].split("-")])
          for runtime in reversed(ios):
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "simulator: $udid"
          [ -n "$udid" ] || { echo "::error title=iOS simulator::no available iPhone simulator"; exit 1; }
          cd apps/ios
          perl -e 'alarm 1500; exec @ARGV' xcodebuild test -project Hoppy.xcodeproj -scheme Hoppy \
            -destination "id=$udid" -derivedDataPath build/dd-test 2>&1 | tee ../../xctest.log ||
            { python3 ../../tools/ci_annotate_xcode.py "iOS simulator tests" ../../xctest.log; exit 1; }
      - name: Unsigned .ipa (device build)
        shell: bash
        run: |
          bash apps/ios/build-ipa.sh 0.0.0 dist 2>&1 | tee ipa.log ||
            { python3 tools/ci_annotate_xcode.py "iOS device build" ipa.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: hoppy-ios
          path: dist/Hoppy-ios-unsigned.ipa

  android:
    name: Android · APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships the Android SDK (ANDROID_HOME set, licenses accepted);
      # AGP downloads any missing platform/build-tools itself.
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        working-directory: apps/android
        run: gradle :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hoppy-android
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
