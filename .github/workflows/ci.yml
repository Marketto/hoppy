name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · check + interop + Kotlin core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: python3 tools/dev.py all

  windows:
    name: Windows · tests + hoppy.exe + hoppyw.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Only place where the #[cfg(windows)] code is compiled and linted. CI logs are not
      # readable by agents, so failures are re-emitted as annotations (tools/ci-annotate.sh).
      # GitHub's bash runs with -e -o pipefail; `cmd | tee log || …` keeps the exit status.
      - name: Clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log ||
            { bash tools/ci-annotate.sh "clippy (Windows)" clippy.log; exit 1; }
      - name: Test
        shell: bash
        run: |
          cargo test --workspace --message-format=short 2>&1 | tee test.log ||
            { bash tools/ci-annotate.sh "cargo test (Windows)" test.log; exit 1; }
      - name: Build
        shell: bash
        run: |
          cargo build --release -p hoppy --message-format=short 2>&1 | tee build.log ||
            { bash tools/ci-annotate.sh "cargo build (Windows)" build.log; exit 1; }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/hoppy.exe dist/
          Copy-Item target/release/hoppyw.exe dist/
          Copy-Item apps/windows/install.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: hoppy-windows
          path: dist/

  android:
    name: Android · APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships the Android SDK (ANDROID_HOME set, licenses accepted);
      # AGP downloads any missing platform/build-tools itself.
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        working-directory: apps/android
        run: gradle :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hoppy-android
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
