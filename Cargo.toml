[workspace]
resolver = "3"
members = ["crates/hoppy-core", "crates/hoppy-cli", "crates/hoppy-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Marco Ricupero"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Static library for iOS (apps/ios/build-xcframework.sh, `--profile ffi`): like release, but
# never strip (a stripped archive loses its exported C symbols) and thin LTO.
[profile.ffi]
inherits = "release"
strip = false
lto = "thin"
