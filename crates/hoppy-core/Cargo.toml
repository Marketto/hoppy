[package]
name = "hoppy-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
sha2 = "0.11.1"
tempfile = "3.27.0"
