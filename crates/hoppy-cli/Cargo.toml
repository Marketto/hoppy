[package]
name = "hoppy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# `cargo run -p hoppy` keeps meaning the CLI; `hoppyw` is the Windows tray/GUI binary.
default-run = "hoppy"

[lib]
name = "hoppy"
path = "src/lib.rs"

[[bin]]
name = "hoppy"
path = "src/main.rs"

[[bin]]
name = "hoppyw"
path = "src/bin/hoppyw.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gethostname = "1.1.0"
hoppy-core = { path = "../hoppy-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Update check: verifies the downloaded installer (same version as hoppy-core).
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    # SHELLEXECUTEINFOW / ShellExecuteExW (UAC "runas" for the firewall rules).
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"

# Debian/Ubuntu package (release.yml linux job, gated by the ENABLE_LINUX repo variable).
[package.metadata.deb]
name = "hoppy"
maintainer = "Marco Ricupero <Marketto@users.noreply.github.com>"
copyright = "2026 Marco Ricupero"
extended-description = "Send files to nearby devices (Windows, Android, Linux) over the local network."
section = "net"
priority = "optional"
assets = [["target/release/hoppy", "usr/bin/", "755"], ["../../LICENSE", "usr/share/doc/hoppy/", "644"]]
