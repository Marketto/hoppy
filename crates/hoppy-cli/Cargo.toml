[package]
name = "hoppy"
description = "Send files to nearby devices"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# `cargo run -p hoppy` keeps meaning the CLI; `hoppyw` is the desktop tray/GUI binary.
default-run = "hoppy"

[lib]
name = "hoppy"
path = "src/lib.rs"

[[bin]]
name = "hoppy"
path = "src/main.rs"

[[bin]]
name = "hoppyw"
path = "src/bin/hoppyw.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gethostname = "1.1.0"
hoppy-core = { path = "../hoppy-core" }
# QR codes of device verification (spec §7.7), drawn by each desktop backend; no renderers.
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Update check: verifies the downloaded installer (same version as hoppy-core).
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    # COPYDATASTRUCT (`hoppyw send` instances hand their files to the first one).
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    # SHELLEXECUTEINFOW / ShellExecuteExW (UAC "runas" for the firewall rules).
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    # SetFocus / EnableWindow (the verification dialog).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux desktop (`hoppyw`, src/linux/): pure-Rust D-Bus (no libdbus), tray icon
# (StatusNotifierItem), notifications, single instance. zbus runs its own background
# executor thread; Hoppy's code stays blocking (no tokio).
[target.'cfg(all(not(windows), not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
png = "0.18.1"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

# macOS desktop (`hoppyw` in Hoppy.app, src/macos/): AppKit, UserNotifications and
# ServiceManagement through objc2 (no Swift/Xcode project). Only the header features in use
# are enabled (the full crates take minutes to compile, twice for the universal binary).
# Built for macOS 12+ (MACOSX_DEPLOYMENT_TARGET=12.0 in CI/release); APIs newer than 12
# (SMAppService) are only called after a runtime version check.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAlert",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphicsContext",
    "NSImage",
    "NSImageView",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSSound",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSLocale",
    "NSObject",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSURL",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"

# Debian/Ubuntu package (release.yml `linux` job → Hoppy-linux-amd64.deb; docs/platforms/linux.md).
# Built on ubuntu-22.04 so it runs on Ubuntu 22.04+ (glibc 2.35). Per-user pieces (right-click
# entries, autostart) are written by `hoppyw` on its first run, not by the package.
[package.metadata.deb]
name = "hoppy"
maintainer = "Marco Ricupero <Marketto@users.noreply.github.com>"
copyright = "2026 Marco Ricupero"
extended-description = """\
Send files to nearby devices (Windows, Android, Linux) over the local network. \
Includes the hoppy command line tool and the Hoppy desktop app: a panel icon that \
receives files, and "Send with Hoppy" in the Files right-click menu."""
section = "net"
priority = "optional"
depends = "$auto"
# zenity/kdialog: device list and file picker; curl/wget: update check; xdg-utils: open folders;
# pkexec: installing updates (else the .deb opens in the software installer).
recommends = "zenity | kdialog, curl | wget, xdg-utils, pkexec | policykit-1"
# Shows the panel icon on GNOME (preinstalled and enabled on Ubuntu).
suggests = "gnome-shell-extension-appindicator"
assets = [
    ["target/release/hoppy", "usr/bin/", "755"],
    ["target/release/hoppyw", "usr/bin/", "755"],
    ["../../apps/linux/hoppy.desktop", "usr/share/applications/", "644"],
    # Self-update: root-owned helper run through pkexec, and its polkit action ("Aggiorna Hoppy").
    ["../../apps/linux/install-update", "usr/lib/hoppy/", "755"],
    ["../../apps/linux/app.hoppy.update.policy", "usr/share/polkit-1/actions/app.hoppy.update.policy", "644"],
    ["../../assets/brand/linux/hoppy-48.png", "usr/share/icons/hicolor/48x48/apps/hoppy.png", "644"],
    ["../../assets/brand/linux/hoppy-128.png", "usr/share/icons/hicolor/128x128/apps/hoppy.png", "644"],
    ["../../assets/brand/linux/hoppy-256.png", "usr/share/icons/hicolor/256x256/apps/hoppy.png", "644"],
    ["../../assets/brand/linux/hoppy-512.png", "usr/share/icons/hicolor/512x512/apps/hoppy.png", "644"],
    ["../../assets/brand/linux/hoppy.svg", "usr/share/icons/hicolor/scalable/apps/hoppy.svg", "644"],
    ["../../LICENSE", "usr/share/doc/hoppy/", "644"],
]
