# XcodeGen spec for Hoppy for iPhone/iPad (docs/platforms/ios.md, ADR 0009).
# The .xcodeproj is generated, never committed:  cd apps/ios && xcodegen generate
# Needs build/HoppyFFI.xcframework first:        bash apps/ios/build-xcframework.sh
name: Hoppy
options:
  bundleIdPrefix: app.hoppy
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Unsigned build: Sideloadly signs with the user's free Apple ID (ADR 0009).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    # The simulator (tests) wants an ad-hoc signature on arm64; no team needed.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    # Native libraries of the Rust staticlib (build-xcframework.sh prints rustc's list).
    OTHER_LDFLAGS: ["-lresolv"]
targets:
  Hoppy:
    type: application
    platform: iOS
    sources:
      - path: Hoppy
      - path: Shared
      # Delivery jingle, generated by tools/gen_music.py (never copied or edited here).
      - path: ../../assets/music/desktop_done.wav
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Hoppy
        PRODUCT_BUNDLE_IDENTIFIER: app.hoppy.ios
        INFOPLIST_FILE: Hoppy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "NO"
    dependencies:
      - framework: build/HoppyFFI.xcframework
        embed: false
      - sdk: Security.framework
      - target: HoppyShare
        embed: true
  HoppyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: HoppyShare
        PRODUCT_BUNDLE_IDENTIFIER: app.hoppy.ios.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: "YES"
    dependencies:
      - framework: build/HoppyFFI.xcframework
        embed: false
      - sdk: Security.framework
  # Host-less unit tests on the simulator: the Swift wrapper + the Rust core.
  HoppyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/HoppyCore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hoppy.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - framework: build/HoppyFFI.xcframework
        embed: false
      - sdk: Security.framework
schemes:
  Hoppy:
    build:
      targets:
        Hoppy: all
        HoppyTests: [test]
    test:
      config: Debug
      targets:
        - HoppyTests
